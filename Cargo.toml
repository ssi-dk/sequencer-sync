[package]
name = "sequencer-sync"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1"
serde_yaml = "0.9"
glob = "0.3.3"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
assert_cmd = "2"

[build-dependencies]
vergen-git2 = { version = "1.0.7", features = ["build"] }
